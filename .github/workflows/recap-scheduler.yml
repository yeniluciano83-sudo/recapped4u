name: Recap scheduler

on:
  schedule:
    # Every 3 hours. Bookings become eligible in 24h/48h windows (see
    # scripts/poll-and-recap.js), so this cadence catches both thresholds
    # promptly without running excessively often.
    - cron: "0 */3 * * *"
  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

jobs:
  poll-and-recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      # ffmpeg-static's Linux binary (johnvansickle.com) is missing the
      # drawtext filter despite claiming --enable-libfreetype -- confirmed
      # live, Roast Reel rendering failed every time with "No such filter:
      # 'drawtext'". Ubuntu's apt package is a full build that has it.
      - name: Install ffmpeg (with drawtext support)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: node scripts/poll-and-recap.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_ALERT_EMAIL: ${{ secrets.ADMIN_ALERT_EMAIL }}
          FFMPEG_PATH: /usr/bin/ffmpeg
