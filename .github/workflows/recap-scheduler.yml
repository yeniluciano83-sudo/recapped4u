name: Recap scheduler

on:
  schedule:
    # Every 3 hours. Bookings become eligible in 24h/48h windows (see
    # scripts/poll-and-recap.js), so this cadence catches both thresholds
    # promptly without running excessively often.
    - cron: "0 */3 * * *"
  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

# Only ever one scheduler run at a time. A cron tick landing on top of a
# manual dispatch (or an operator dispatching twice) would otherwise put
# two runs against the same in-progress render -- the per-booking render
# lock in scripts/poll-and-recap.js mostly covers that, but its
# stale-timeout is necessarily shorter than this job's 75-minute cap, so
# there's a window where both could claim the same render. Queue instead
# of overlapping; cancel-in-progress: false so a run that's mid-encode is
# never killed to make way for a newer one.
concurrency:
  group: recap-scheduler
  cancel-in-progress: false

jobs:
  poll-and-recap:
    runs-on: ubuntu-latest
    # Default job timeout is 6 hours -- way too long for this. Real runs
    # (a handful of bookings, each with real photo analysis + video
    # encoding) take a few minutes; a genuine hang (confirmed live: apt-get
    # install waiting on an interactive prompt with no terminal attached,
    # see below) should fail fast and free up Actions minutes rather than
    # sit there for hours.
    #
    # 20 minutes wasn't enough: confirmed live, a Spotlight-tier booking
    # with Roast Reel got silently killed mid-"editing" by this exact
    # timeout -- not because of a large photo count, but because Spotlight
    # renders a full recap video *and* up to 5 social cuts, each in a roast
    # and no-roast pair (10+ separate ffmpeg encodes in one job run), which
    # a shared CI runner can't necessarily finish in 20 minutes. A hard
    # timeout kill bypasses every catch block, so the booking was left
    # stuck with no error anywhere until the pipeline's own 1.5h stale-
    # recovery (see STALE_EDITING_HOURS in scripts/poll-and-recap.js)
    # reverted it back to "collecting" to start over from scratch.
    #
    # 45 minutes wasn't enough either: confirmed live, a Luxe-tier booking
    # (80 photos, Roast Reel, full video + up to 10 social cuts -- most
    # real bookings are this size or larger, not an outlier) still hit this
    # timeout even after the render itself became memory-bounded (see
    # MAX_SLOTS_PER_CHUNK in lib/video-assemble.js) -- there's simply a lot
    # of ffmpeg encoding to do in one job run for a booking this size,
    # regardless of memory. Raised to comfortably cover that, while staying
    # under two other ceilings on purpose: STALE_EDITING_HOURS (90 minutes)
    # above, so a genuinely hung job still gets killed by *this* timeout
    # before the separate stale-recovery pass would also try to intervene
    # on the same booking from a different process; and the 3-hour (180
    # minute) cron cadence above, so one run is guaranteed to finish before
    # the next one starts.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: npm ci

      # ffmpeg-static's Linux binary (johnvansickle.com) is missing the
      # drawtext filter despite claiming --enable-libfreetype -- confirmed
      # live, Roast Reel rendering failed every time with "No such filter:
      # 'drawtext'". Ubuntu's apt package is a full build that has it.
      #
      # DEBIAN_FRONTEND/NEEDRESTART_* suppress two different interactive
      # prompts that Ubuntu 24.04 runners can pop up during apt-get install
      # (a debconf prompt, and needrestart's "which services should be
      # restarted?" dialog) -- confirmed live, without these the install
      # step hung indefinitely with no output, since there's no terminal
      # attached in CI to answer either prompt.
      - name: Install ffmpeg (with drawtext support)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      - run: node scripts/poll-and-recap.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_ALERT_EMAIL: ${{ secrets.ADMIN_ALERT_EMAIL }}
          FFMPEG_PATH: /usr/bin/ffmpeg
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
